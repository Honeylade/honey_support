name: updater_graphql Updater
 
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC (adjust as needed)
 
jobs:
  run-updater:
    runs-on: ubuntu-latest
    env:
      SHOP_URL: ${{ secrets.SHOP_URL }}
      ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
      API_VERSION: "2024-01"
      XML_URL: ${{ secrets.XML_URL }}
      LIMIT: ""               # set if you want a limit
      BATCH_SIZE: "25"
      WORKERS: "2"
      CHECKPOINT_S3_BUCKET: ${{ secrets.CHECKPOINT_S3_BUCKET }}   # optional
      CHECKPOINT_S3_KEY: "shopify_updater_checkpoint.json"
      LOCAL_CHECKPOINT: "checkpoint.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
 
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml beautifulsoup4 boto3

      - name: Make script executable
        run: chmod +x updater_graphql.py
 
      - name: Run updater
        run: |
          ./updater_graphql.py
